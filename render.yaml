services:
  - type: web
    name: inksigma-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: inksigma-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: TOKEN_HASH_SECRET
        sync: false
      - key: BASE_DOMAIN
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CUSTOM_DOMAIN_IP_TARGET
        sync: false
      - key: CUSTOM_DOMAIN_IP_TARGETS
        sync: false
      - key: CUSTOM_DOMAIN_CNAME_TARGET
        sync: false
      - key: CUSTOM_DOMAIN_CNAME_TARGETS
        sync: false
      - key: CUSTOM_DOMAIN_MULTI_LABEL_SUFFIXES
        sync: false
      - key: CUSTOM_DOMAIN_REACHABILITY_TIMEOUT_MS
        value: 8000
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_PROJECT_ID_OR_NAME
        sync: false
      - key: VERCEL_TEAM_ID
        sync: false
      - key: VERCEL_TEAM_SLUG
        sync: false
      - key: VERCEL_API_TIMEOUT_MS
        value: 8000
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        value: InkSigma
      - key: RESEND_OPERATION_TIMEOUT_MS
        value: 8000
      - key: RESEND_MAX_CONCURRENCY
        value: 5
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: VALIDATE_EMAIL_MX
        value: false

databases:
  - name: inksigma-db
    databaseName: inksigma
    user: inksigma_user
    plan: free
