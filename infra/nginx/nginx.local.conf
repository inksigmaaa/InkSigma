worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  upstream inksigma_app {
    server 127.0.0.1:3000;
  }

  # Support for localhost
  server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.localhost$ localhost;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://inksigma_app;
    }
  }

  # Support for inksigma.local
  server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.inksigma\.local$ inksigma.local;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://inksigma_app;
    }
  }

  # Support for local custom domains like tennyson.local
  server {
    listen 80;
    server_name ~^(?<customdomain>[^.]+)\.local$;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://inksigma_app;
    }
  }
}
